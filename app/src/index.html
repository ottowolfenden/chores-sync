<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="manifest" href="assets/site.webmanifest" />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/pages/index.css" />
        <script type="module" src="pages/index.js"></script>
    </head>
    <body>
        <main>
            <section id="today" hidden>
                <div id="assigned-chores">
                    <div>
                        <h2>Assigned chores</h2>
                        <button class="filled" id="edit">
                            <md-icon>edit</md-icon>
                            <span>Edit</span>
                        </button>
                    </div>
                    <ul inert>
                        <li>
                            <span class="chore-name">Drying up</span>
                            <span class="chore-quantity">×2</span>
                            <md-icon class="swapped" data-enabled>swap_horiz</md-icon>
                            <div class="name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Ivo</span>
                                    <md-icon>arrow_drop_down</md-icon>
                                </button>
                                <div popover>
                                    <button class="tonal"><span>Otto</span></button>
                                    <button class="tonal"><span>Emily</span></button>
                                </div>
                            </div>
                            <button class="remove tonal small">
                                <md-icon>remove</md-icon>
                            </button>
                        </li>

                        <li>
                            <span class="chore-name">Washing up</span>
                            <span class="chore-quantity" data-enabled>×300</span>
                            <md-icon class="swapped">swap_horiz</md-icon>
                            <div class="name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Otto</span>
                                    <md-icon>arrow_drop_down</md-icon>
                                </button>
                                <div popover>
                                    <button class="tonal"><span>Emily</span></button>
                                    <button class="tonal"><span>Ivo</span></button>
                                </div>
                            </div>
                            <button class="remove tonal small">
                                <md-icon>remove</md-icon>
                            </button>
                        </li>

                        <li>
                            <span class="chore-name">Emptying dishwasher</span>
                            <span class="chore-quantity" data-enabled>×3</span>
                            <md-icon class="swapped" data-enabled>swap_horiz</md-icon>
                            <div class="name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Emily</span>
                                    <md-icon>arrow_drop_down</md-icon>
                                </button>
                                <div popover>
                                    <button class="tonal"><span>Otto</span></button>
                                    <button class="tonal"><span>Ivo</span></button>
                                </div>
                            </div>
                            <button class="remove tonal small">
                                <md-icon>remove</md-icon>
                            </button>
                        </li>
                    </ul>
                    <status-message></status-message>
                </div>
                <div id="all-chores">
                    <div><h2>All chores</h2></div>
                    <ul>
                        <template>
                            <li>
                                <span class="chore-name"></span>
                                <span class="member-name"></span>
                                <button class="transparent small">
                                    <md-icon>add</md-icon>
                                </button>
                            </li>
                        </template>
                    </ul>
                    <status-message></status-message>
                </div>
            </section>

            <section id="history" hidden>
                <div><h2>History</h2></div>
            </section>

            <section id="count" hidden>
                <div>
                    <h2>Count</h2>
                    <button class="filled" id="expand-all">
                        <md-icon>expand_content</md-icon>
                        <span>Expand all</span>
                    </button>
                </div>

                <ul>
                    <template>
                        <li>
                            <div class="chore">
                                <span class="chore-name"></span>
                                <span class="total-count">
                                    <span class="num"></span><span class="suffix"> total</span>
                                </span>
                                <button class="tonal small edit">
                                    <md-icon>edit</md-icon><span>Edit</span>
                                </button>
                                <button class="expand transparent">
                                    <md-icon>keyboard_arrow_down</md-icon>
                                </button>
                            </div>
                            <ul class="details" inert>
                                <template>
                                    <li>
                                        <span class="member-name"></span>
                                        <div class="count-input">
                                            <button class="minus tonal small">
                                                <md-icon>remove</md-icon>
                                            </button>
                                            <input type="number" name="chore-quantity" />
                                            <button class="plus tonal small">
                                                <md-icon>add</md-icon>
                                            </button>
                                        </div>
                                        <span class="count-text">
                                            <span class="num"></span
                                            ><span class="suffix"> times</span>
                                        </span>
                                        <span class="offset">
                                            (<span class="num"></span
                                            ><span class="suffix"> offset</span>)
                                        </span>
                                    </li>
                                </template>
                            </ul>
                        </li>
                    </template>
                </ul>
                <status-message></status-message>
            </section>

            <section id="settings" hidden>
                <div><h2>Settings</h2></div>
            </section>
        </main>

        <section-nav></section-nav>
    </body>
</html>
