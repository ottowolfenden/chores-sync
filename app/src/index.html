<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="manifest" href="assets/site.webmanifest" />
        <link rel="stylesheet" href="styles/global.css" />
        <script type="module" src="scripts/index.js"></script>
    </head>
    <body>
        <main>
            <section id="today" hidden>
                <div id="assigned-chores">
                    <div>
                        <h2>Assigned chores</h2>
                        <button class="tonal" id="edit">
                            <span class="icon">edit</span>
                            <span>Edit</span>
                        </button>
                    </div>
                    <ul data-edit-mode>
                        <li>
                            <span class="chore-attrs">
                                <span class="name">Drying up</span>
                                <span class="quantity">×2</span>
                                <span class="swapped icon">autorenew</span>
                            </span>
                            <div class="member-name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Ivo</span>
                                    <span class="icon">arrow_drop_down</span>
                                </button>
                                <ul popover>
                                    <li><button>Otto</button></li>
                                    <li><button>Emily</button></li>
                                </ul>
                            </div>
                            <button class="remove tonal small">
                                <span class="icon">remove</span>
                            </button>
                        </li>

                        <li>
                            <span class="chore-attrs">
                                <span class="name">Washing up</span>
                                <span class="quantity">×3</span>
                                <!-- <span class="swapped icon">autorenew</span> -->
                            </span>
                            <div class="member-name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Otto</span>
                                    <span class="icon">arrow_drop_down</span>
                                </button>
                                <ul popover>
                                    <li><button>Emily</button></li>
                                    <li><button>Ivo</button></li>
                                </ul>
                            </div>
                            <button class="remove tonal small">
                                <span class="icon">remove</span>
                            </button>
                        </li>

                        <li>
                            <span class="chore-attrs">
                                <span class="name">Emptying dishwasher</span>
                                <!-- <span class="quantity">×2</span>
                                <span class="swapped icon">autorenew</span> -->
                            </span>
                            <div class="member-name-dropdown">
                                <button class="tonal">
                                    <span class="member-name">Emily</span>
                                    <span class="icon">arrow_drop_down</span>
                                </button>
                                <ul popover>
                                    <li><button>Otto</button></li>
                                    <li><button>Ivo</button></li>
                                </ul>
                            </div>
                            <button class="remove tonal small">
                                <span class="icon">remove</span>
                            </button>
                        </li>
                    </ul>
                </div>
                <div id="turns">
                    <div><h2>Turns</h2></div>
                    <ul>
                        <li>
                            <span class="chore-name">Washing up</span>
                            <span class="member-name">Otto</span>
                            <button><span class="icon">add</span></button>
                        </li>
                        <li>
                            <span class="chore-name">Emptying dishwasher</span>
                            <span class="member-name">Ivo</span>
                            <button><span class="icon">add</span></button>
                        </li>
                        <li>
                            <span class="chore-name">Take in washing</span>
                            <span class="member-name">Otto</span>
                            <button><span class="icon">add</span></button>
                        </li>
                    </ul>
                </div>
            </section>
            <section id="history" hidden>history</section>
            <section id="count" hidden>count</section>
            <section id="settings" hidden>settings</section>
        </main>

        <nav>
            <a href="#today">
                <span class="icon">today</span>
                <span>Today</span>
            </a>
            <a href="#history">
                <span class="icon">history</span>
                <span>History</span>
            </a>
            <a href="#count">
                <span class="icon">bar_chart</span>
                <span>Count</span>
            </a>
            <a href="#settings">
                <span class="icon">settings</span>
                <span>Settings</span>
            </a>
        </nav>
    </body>
</html>
