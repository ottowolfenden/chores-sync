<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="manifest" href="assets/site.webmanifest" />
        <link rel="stylesheet" href="styles/global.css" />
        <script type="module" src="scripts/index.js"></script>
    </head>
    <body>
        <main>
            <section id="today" hidden>
                <div id="your-chores">
                    <div>
                        <h2>Your chores</h2>
                        <button class="tonal" id="dismiss-all">
                            <span class="icon">done_all</span>
                            <span>Dismiss all</span>
                        </button>
                    </div>
                    <ul>
                        <li>
                            <label>
                                <input type="checkbox" />
                                <span>Washing up</span>
                            </label>
                        </li>
                        <li>
                            <label>
                                <input type="checkbox" />
                                <span>Drying up</span>
                            </label>
                        </li>
                    </ul>
                </div>
                <div id="all-chores">
                    <div><h2>All chores</h2></div>
                    <table>
                        <tr>
                            <td class="chore-name">Washing up</td>
                            <td class="member-name">Ivo</td>
                            <td class="assignment">
                                <button class="tonal small">
                                    <span class="icon">assignment</span>
                                    <span>Assign</span>
                                </button>
                            </td>
                            <td class="edit">
                                <button class="tonal small">
                                    <span class="icon">edit</span>
                                </button>
                            </td>
                        </tr>

                        <tr data-assigned>
                            <td class="chore-name">Drying up</td>
                            <td class="member-name">Otto</td>
                            <td class="assignment">
                                <button class="tonal small">
                                    <span class="icon">assignment</span>
                                    <span>Assign</span>
                                </button>
                            </td>
                            <td class="edit">
                                <button class="tonal small">
                                    <span class="icon">edit</span>
                                </button>
                            </td>
                        </tr>

                        <tr>
                            <td class="chore-name">Folding washing</td>
                            <td class="member-name">Emily</td>
                            <td class="assignment">
                                <button class="tonal small">
                                    <span class="icon">assignment</span>
                                    <span>Assign</span>
                                </button>
                            </td>
                            <td class="edit">
                                <button class="tonal small">
                                    <span class="icon">edit</span>
                                </button>
                            </td>
                        </tr>
                    </table>
                </div>
            </section>
            <section id="history" hidden>history</section>
            <section id="count" hidden>count</section>
            <section id="settings" hidden>settings</section>
        </main>

        <nav>
            <a href="#today">
                <span class="icon">today</span>
                <span>Today</span>
            </a>
            <a href="#history">
                <span class="icon">history</span>
                <span>History</span>
            </a>
            <a href="#count">
                <span class="icon">bar_chart</span>
                <span>Count</span>
            </a>
            <a href="#settings">
                <span class="icon">settings</span>
                <span>Settings</span>
            </a>
        </nav>
    </body>
</html>
