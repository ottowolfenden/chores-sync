<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A simple app for sharing chores." />
        <meta name="author" content="Otto Wolfenden" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#005eb2" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#a7c8ff" media="(prefers-color-scheme: dark)" />
        <link rel="manifest" href="assets/site-light.webmanifest" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" sizes="any" />
        <link
            rel="icon"
            href="assets/icons/light/favicon.ico"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64 128x128"
            media="(prefers-color-scheme: light)" />
        <link
            rel="icon"
            href="assets/icons/dark/favicon.ico"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64 128x128"
            media="(prefers-color-scheme: dark)" />
        <link
            rel="apple-touch-icon"
            href="assets/icons/light/apple-touch-icon.png"
            type="image/png"
            sizes="180x180" />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/pages/login.css" />
        <script type="module" src="global.js"></script>
        <script type="module" src="pages/login.js"></script>
    </head>
    <body>
        <h1>Chores Sync</h1>
        <form>
            <div>
                <label>
                    <span>Name</span>
                    <input type="text" name="name" autocomplete="given-name" autofocus />
                </label>
                <label>
                    <span>Secret</span>
                    <input type="password" name="secret" autocomplete="off" />
                </label>
            </div>
            <button type="submit" class="filled">
                <md-icon>login</md-icon>
                <span>Log in</span>
            </button>
        </form>
    </body>
</html>
