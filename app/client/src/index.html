<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A simple app for sharing chores." />
        <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
        <link rel="manifest" href="assets/site.webmanifest" />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/pages/index.css" />
        <script type="module" src="pages/index.js"></script>
    </head>
    <body>
        <main>
            <section id="today" hidden>
                <div id="assignments">
                    <div>
                        <h2>Assigned<span class="suffix"> chores</span></h2>
                        <state-actions></state-actions>
                    </div>
                    <assignments-list></assignments-list>
                    <status-message></status-message>
                </div>
                <div id="turns">
                    <div><h2>All chores</h2></div>
                    <turns-list></turns-list>
                    <status-message></status-message>
                </div>
            </section>

            <section id="history" hidden>
                <div><h2>History</h2></div>
            </section>

            <section id="count" hidden>
                <div>
                    <h2>Count</h2>
                    <button class="filled" id="expand-all">
                        <md-icon>expand_content</md-icon>
                        <span>Expand all</span>
                    </button>
                </div>
                <counts-list></counts-list>
                <status-message></status-message>
            </section>

            <section id="settings" hidden>
                <div><h2>Settings</h2></div>
            </section>
        </main>

        <section-nav></section-nav>
    </body>
</html>
