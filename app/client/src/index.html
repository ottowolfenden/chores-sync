<!doctype html>
<html lang="en">
    <head>
        <title>Chores Sync</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="description" content="A simple app for sharing chores." />
        <meta name="author" content="Otto Wolfenden" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#090e17" media="(prefers-color-scheme: dark)" />
        <link rel="manifest" href="assets/site-light.webmanifest" />
        <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" sizes="any" />
        <link
            rel="icon"
            href="assets/icons/light/favicon.ico"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64 128x128"
            media="(prefers-color-scheme: light)" />
        <link
            rel="icon"
            href="assets/icons/dark/favicon.ico"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64 128x128"
            media="(prefers-color-scheme: dark)" />
        <link
            rel="apple-touch-icon"
            href="assets/icons/light/apple-touch-icon.png"
            type="image/png"
            sizes="180x180" />
        <link rel="stylesheet" href="styles/global.css" />
        <link rel="stylesheet" href="styles/pages/index.css" />
        <script type="module" src="pages/index.js"></script>
    </head>
    <body>
        <main>
            <section id="today" hidden>
                <div id="assignments">
                    <div>
                        <h2>Assigned<span class="suffix"> chores</span></h2>
                        <state-actions></state-actions>
                    </div>
                    <assignments-list></assignments-list>
                    <status-message></status-message>
                </div>
                <div id="turns">
                    <div><h2>Turns</h2></div>
                    <turns-list></turns-list>
                    <status-message></status-message>
                </div>
            </section>

            <section id="timeline" hidden>
                <timeline-list></timeline-list>
                <status-message class="centered"></status-message>
            </section>

            <section id="count" hidden>
                <div>
                    <h2>Count</h2>
                    <state-actions></state-actions>
                </div>
                <counts-list></counts-list>
                <status-message></status-message>
            </section>

            <section id="settings" hidden>
                <div><h2>Settings</h2></div>
            </section>
        </main>

        <section-nav></section-nav>
    </body>
</html>
